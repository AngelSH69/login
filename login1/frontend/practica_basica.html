<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Proyectos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fa;
        padding: 20px;
      }
      .card {
        margin-bottom: 15px;
      }
      .alta {
        border-left: 5px solid #dc3545;
      }
      .media {
        border-left: 5px solid #ffc107;
      }
      .baja {
        border-left: 5px solid #28a745;
      }
    </style>
  </head>
  <body>

    <div class="container">
        
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Práctica 1 - Básica</a>
            <div class="ms-auto">
                <span class="navbar-text text-white me-3" id="userInfo"></span>
                <a href="portada.html" class="btn btn-light btn-sm me-2">Volver</a>
                <button class="btn btn-danger btn-sm" onclick="logout()">Salir</button>
            </div>
        </div>
    </nav>

      <h1 class="my-4">Gestión de Proyectos</h1>

      <button
        id="btnNuevo"
        class="btn btn-primary mb-4"
        data-bs-toggle="modal"
        data-bs-target="#modalProyecto"
      >
        Nuevo Proyecto
      </button>

      <div id="listaProyectos">
        <!-- Proyectos se cargan aquí -->
      </div>

      <div id="sinProyectos" class="alert alert-info" style="display: none">
        No hay proyectos registrados
      </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="modalProyecto">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 id="modalTitulo" class="modal-title">Nuevo Proyecto</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="formProyecto">
              <!-- id oculto para editar -->
              <input type="hidden" id="proyectoId" />

              <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea
                  class="form-control"
                  id="descripcion"
                  rows="3"
                ></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label">Fecha</label>
                <input type="date" class="form-control" id="fecha" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Prioridad</label>
                <select class="form-select" id="prioridad" required>
                  <option value="">Seleccionar</option>
                  <option value="baja">Baja</option>
                  <option value="media">Media</option>
                  <option value="alta">Alta</option>
                </select>
              </div>
              <button id="btnGuardar" type="submit" class="btn btn-primary">
                Guardar
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
        const token = localStorage.getItem('token');
        const usuario = localStorage.getItem('usuario');
        const rol = localStorage.getItem('rol');

        if (!token) window.location.href = 'login.html';
        document.getElementById('userInfo').textContent = `${usuario} (${rol})`;

        function logout() {
            localStorage.clear();
            window.location.href = 'portada.html';
        }
</script>
  </body>
</html>
