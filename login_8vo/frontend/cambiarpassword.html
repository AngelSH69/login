<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cambiar contraseña</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <div class="card p-4 shadow">
    <h3>Cambiar contraseña</h3>

    <!-- Sin action ni method: lo maneja JS -->
    <form id="formCambiar">
      <input id="usuario" class="form-control mb-2" placeholder="Usuario" required>
      <input type="password" id="passwordActual" class="form-control mb-2" placeholder="Actual" required>
      <input type="password" id="nuevaPassword" class="form-control mb-3" placeholder="Nueva" required>
      <button type="submit" class="btn btn-warning">Actualizar</button>
    </form>

    <div id="mensaje" class="d-none"></div>
    <a href="/" class="mt-3 d-block">Volver</a>
  </div>
</div>

<script src="cambiar-password.js"></script>
</body>
</html>
