<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos Básica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Tabla de usuarios</a>
            <div class="ms-auto">
                <span class="navbar-text text-white me-3" id="userInfo"></span>
                <a href="portada.html" class="btn btn-light btn-sm me-2">Volver</a>
                <button class="btn btn-danger btn-sm" onclick="logout()">Salir</button>
            </div>
        </div>
    </nav>
    
    <div class="container mt-5">
        <div class="alert alert-info">
            <h4>Crear Nuevo Usuario</h4>
        </div>

        <!-- FORMULARIO NUEVO USUARIO -->
        <div class="row justify-content-center mt-4">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Crear Nuevo Usuario</h5>
                    </div>

                    <div class="card-body">
                        <form id="formUsuario">

                            <!-- Usuario -->
                            <div class="mb-3">
                                <label for="usuarioNuevo" class="form-label">Nombre de usuario</label>
                                <input type="text" class="form-control" id="usuarioNuevo" name="usuario" required>
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label for="passwordNuevo" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="passwordNuevo" name="password" required>
                            </div>

                            <!-- Rol -->
                            <div class="mb-3">
                                <label for="rolNuevo" class="form-label">Rol</label>
                                <select class="form-select" id="rolNuevo" name="rol" required>
                                    <option value="">Selecciona un rol</option>
                                    <option value="admin">Administrador</option>
                                    <option value="invitado">Invitado</option>
                                </select>
                            </div>

                            <!-- Botón -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-success">
                                    Crear Usuario
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
        <!-- FIN FORMULARIO -->

    </div>
    <!-- LISTA DE USUARIOS -->
    <div class="container mt-5">
        <h3>Lista de Usuarios</h3>

        <div id="listaUsuarios"></div>

        <div id="sinUsuarios" class="alert alert-info" style="display:none;">
            No hay usuarios registrados
        </div>
    </div>

    <script src="plantilla.js"></script>
    <script>
        const token = localStorage.getItem('token');
        const usuario = localStorage.getItem('usuario');
        const rol = localStorage.getItem('rol');

        if (!token) window.location.href = 'login.html';
        document.getElementById('userInfo').textContent = `${usuario} (${rol})`;

        function logout() {
            localStorage.clear();
            window.location.href = 'portada.html';
        }
    </script>

</body>
</html>
