<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Práctica 3 - Sistema de usuarios</a>
            <div class="ms-auto">
                <span class="navbar-text text-white me-3" id="userInfo"></span>
                <a href="portada.html" class="btn btn-light btn-sm me-2">Volver</a>
                <button class="btn btn-danger btn-sm" onclick="logout()">Salir</button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="alert alert-info">
            <h4>Práctica 3 - Sistema de usuarios</h4>
            <a href="registro.html" class="btn btn-primary mb-2">Registrar</a>
            <a href="cambiar_password.html" class="btn btn-warning mb-2">Cambiar contraseña</a>
            <!--fetch con token en lugar de <a href> -->
            <button class="btn btn-success mb-2" onclick="verUsuarios()">Ver usuarios</button>
        </div>
        <!-- tabla se renderiza aquí -->
        <div id="tablaUsuarios"></div>
    </div>

<script>
  // muestra usuario logueado en navbar
  const usuario = localStorage.getItem('usuario');
  const rol = localStorage.getItem('rol');
  if (usuario) {
    document.getElementById('userInfo').textContent = usuario + ' (' + rol + ')';
  }

  function logout() {
    localStorage.clear();
    window.location.href = 'portada.html';
  }

  async function verUsuarios() {
    const token = localStorage.getItem('token');

    try {
      const res = await fetch('/api/usuarios', {
        headers: { 'Authorization': 'Bearer ' + token }  // token en el header
      });

      if (!res.ok) {
        document.getElementById('tablaUsuarios').innerHTML =
          '<div class="alert alert-danger">Acceso denegado</div>';
        return;
      }

      // el backend devuelve HTML directamente, lo insertamos
      const html = await res.text();
      document.getElementById('tablaUsuarios').innerHTML = html;

    } catch (err) {
      document.getElementById('tablaUsuarios').innerHTML =
        '<div class="alert alert-danger">Error de conexión</div>';
    }
  }
</script>
</body>
</html>
