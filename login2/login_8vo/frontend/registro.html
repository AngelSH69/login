<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <div class="card p-4 shadow">
    <h3>Registrar Usuario</h3>
    <div id="mensaje"></div>
    <div class="mb-2">
      <input class="form-control" id="usuario" placeholder="Usuario" required>
    </div>
    <div class="mb-2">
      <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
    </div>
    <div class="mb-3">
      <select class="form-select" id="rol" required>
        <option value="">Selecciona un rol</option>
        <option value="admin">admin</option>
        <option value="usuario">usuario</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="registrar()">Guardar</button>
    <a href="/sistema_usuarios.html" class="mt-3 d-inline-block">Volver</a>
  </div>
</div>

<script>
  async function registrar() {
    const usuario = document.getElementById('usuario').value;
    const password = document.getElementById('password').value;
    const rol = document.getElementById('rol').value;
    const token = localStorage.getItem('token');
    const msg = document.getElementById('mensaje');

    if (!usuario || !password || !rol) {
      msg.innerHTML = '<div class="alert alert-warning">Completa todos los campos</div>';
      return;
    }

    try {
      const res = await fetch('/api/registrar', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token  //token en el header
        },
        body: JSON.stringify({ usuario, password, rol })
      });

      const data = await res.json();

      if (res.ok) {
        msg.innerHTML = '<div class="alert alert-success">' + data.mensaje + '</div>';
        document.getElementById('usuario').value = '';
        document.getElementById('password').value = '';
        document.getElementById('rol').value = '';
      } else {
        msg.innerHTML = '<div class="alert alert-danger" ' + data.error + '</div>';
      }
    } catch (err) {
      msg.innerHTML = '<div class="alert alert-danger">Error de conexión</div>';
    }
  }
</script>
</body>
</html>
