<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Crear cuenta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5" style="max-width: 420px;">
  <div class="card p-4 shadow">
    <h3 class="mb-3">Crear cuenta</h3>
    <div id="mensaje"></div>
    <div class="mb-2">
      <input class="form-control" id="usuario" placeholder="Usuario" required>
    </div>
    <div class="mb-3">
      <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
    </div>
    <button class="btn btn-primary w-100" onclick="registrar()">Registrarse</button>
    <a href="login.html" class="mt-3 d-block text-center">Inicia sesión</a>
  </div>
</div>
<script src="registro_publico.js"></script>
</body>
</html>
